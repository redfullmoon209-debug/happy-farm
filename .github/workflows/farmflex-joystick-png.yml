name: Verify FarmFlex UI artwork
on:
  push:
    branches: [main]
    paths:
      - "assets/ui/farmflex_joystick/**"
      - "assets/ui/farmflex_cream/**"
      - ".github/workflows/farmflex-joystick-png.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compare transparent PNG layers with their standalone vector sources
        run: |
          python -m pip install --quiet cairosvg pillow
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from xml.etree import ElementTree
          import cairosvg
          from PIL import Image, ImageChops, ImageStat
          for folder in ("farmflex_cream", "farmflex_joystick"):
              root = Path("assets/ui") / folder
              sources = sorted(root.rglob("*.svg"))
              assert sources
              for src in sources:
                  tags = {node.tag.split("}")[-1] for node in ElementTree.parse(src).iter()}
                  assert tags.isdisjoint({"text", "image", "foreignObject"}), src
                  actual = Image.open(src.with_suffix(".png")).convert("RGBA")
                  assert actual.getchannel("A").getextrema()[0] == 0, src
                  expected = Image.open(BytesIO(cairosvg.svg2png(url=str(src)))).convert("RGBA")
                  assert actual.size == expected.size, src
                  for bg in ("black", "white"):
                      canvas = Image.new("RGBA", actual.size, bg)
                      a = Image.alpha_composite(canvas, actual)
                      b = Image.alpha_composite(canvas, expected)
                      assert max(ImageStat.Stat(ImageChops.difference(a,b)).mean) < 4, src
                  print(src, actual.size)
          PY
