name: Happy Farm Clean - Godot Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: happy-farm-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Bundle original music, sound effects and recorded Thai voice
        run: bash tools/prepare_audio.sh
      - name: Store WAV sound assets permanently in the repository
        run: |
          git add assets/audio
          if git diff --cached --quiet; then
            echo "Audio assets already committed."
          else
            git config user.name "happy-farm-audio-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Bundle original music, farm Foley and Thai farmer voice audio"
            git push origin HEAD:main || echo "Audio stays in this web build; repository upload was blocked."
          fi
      - name: Download Godot
        run: |
          curl -fLsS --retry 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o editor.zip
          unzip -q editor.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          curl -fLsS --retry 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -o templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q templates.tpz -d downloaded_templates
          cp -a downloaded_templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - name: Strict GDScript validation
        run: |
          set -o pipefail
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script' /tmp/import.log; then exit 1; fi
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --quit-after 15 2>&1 | tee /tmp/runtime.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|Invalid call|Invalid access|ERROR:' /tmp/runtime.log; then exit 1; fi
      - name: Save backup regression tests
        run: |
          set -o pipefail
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tools/test_saves.gd 2>&1 | tee /tmp/save-tests.log
          grep -q 'SAVE TESTS PASS' /tmp/save-tests.log
      - name: Farm expansion and pig-purchase tests
        run: |
          set -o pipefail
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tools/test_farm.gd 2>&1 | tee /tmp/farm-tests.log
          grep -q 'FARM TESTS PASS' /tmp/farm-tests.log
      - name: Character movement and animations
        run: |
          set -o pipefail
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tools/test_farmer.gd 2>&1 | tee /tmp/farmer-test.log
          grep -q 'FARMER TESTS PASS' /tmp/farmer-test.log
      - name: Happy Farm audio integration checks
        run: |
          set -o pipefail
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tools/test_audio.gd 2>&1 | tee /tmp/audio-tests.log
          grep -q 'AUDIO TESTS PASS' /tmp/audio-tests.log
      - name: Export web
        run: |
          set -o pipefail
          mkdir -p build/web
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --export-release Web build/web/index.html 2>&1 | tee /tmp/export.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|ERROR:' /tmp/export.log; then exit 1; fi
          test -s build/web/index.html
          touch build/web/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - uses: actions/deploy-pages@v4
