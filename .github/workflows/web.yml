name: Export Godot Web & publish
on:
  push:
    branches: [main]
    paths:
      - 'project.godot'
      - 'scripts/**'
      - 'scenes/**'
      - 'assets/**'
      - 'export_presets.cfg'
      - '.github/workflows/web.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  export:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.4.1 editor and web templates
        run: |
          set -e
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q Godot_v4.4.1-stable_export_templates.tpz -d template_unpack
          cp -a template_unpack/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - name: Import assets and check project
        run: |
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Build HTML5 single-thread
        run: |
          mkdir -p build/web
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html
          touch build/web/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
