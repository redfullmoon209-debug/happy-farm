name: Happy Farm Clean - Godot Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: happy-farm-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Bundle original music, sound effects and recorded Thai voice
        run: bash tools/prepare_audio.sh
      - name: Store WAV sound assets permanently in the repository
        run: |
          git add assets/audio
          if git diff --cached --quiet; then
            echo "Audio assets already committed."
          else
            git config user.name "happy-farm-audio-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Bundle original music, farm Foley and Thai farmer voice audio"
            git push origin HEAD:main || echo "Audio stays in this web build; repository upload was blocked."
          fi
      - name: Restore exact Codex male and female GLB assets
        run: |
          set -euo pipefail
          cat web/character_assets/pack_*.b64 | base64 -d > /tmp/farmflex-character-source.zip
          echo "7b9a38c0b8d08f3a1ad2751c8e42af01714c50e9780786f760c71f13772113a5  /tmp/farmflex-character-source.zip" | sha256sum -c -
          mkdir -p assets/characters
          unzip -jo /tmp/farmflex-character-source.zip "*/Female_Character_Complete.glb" "*/Male_Character_Complete.glb" "*/character_manifest.json" "*/appearance_presets.json" -d assets/characters
          test -s assets/characters/Female_Character_Complete.glb
          test -s assets/characters/Male_Character_Complete.glb
          echo "EXACT CODEX SOURCE MODEL ASSETS RESTORED"
      - name: Restore the eight original user-supplied Mixamo FBX files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          source=Path('assets/animations/source/Male_Talking.zip')
          assert source.exists(), 'Original user-uploaded animation bundle missing'
          assert hashlib.sha256(source.read_bytes()).hexdigest()=='3c4799af829ac4c5083d50252eb4c395e49ba698cd9d26091f4787de1c9a3542', 'Animation ZIP checksum mismatch'
          layout={
            'Male_Idle.fbx': 'male/Idle.fbx',
            'Male_Walking.fbx': 'male/Walk.fbx',
            'Male_Run Forward.fbx': 'male/Run.fbx',
            'Male_Talking.fbx': 'male/Talk.fbx',
            'Female_Idle.fbx': 'female/Idle.fbx',
            'Female_Walking.fbx': 'female/Walk.fbx',
            'Female_Running.fbx': 'female/Run.fbx',
            'Female_Talking.fbx': 'female/Talk.fbx',
          }
          with zipfile.ZipFile(source) as archive:
            for original,new in layout.items():
              content=archive.read(original)
              assert content.startswith(b'Kaydara FBX Binary'),original
              dst=Path('assets/animations')/new
              dst.parent.mkdir(parents=True,exist_ok=True)
              dst.write_bytes(content)
              print('ORIGINAL MIXAMO:', original, '=>', dst, len(content),'bytes')
          PY
      - name: Download Godot
        run: |
          curl -fLsS --retry 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o editor.zip
          unzip -q editor.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          curl -fLsS --retry 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -o templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q templates.tpz -d downloaded_templates
          cp -a downloaded_templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - name: Validate public player creation UI (no local-file uploader)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('web/create-character.html').read_text(encoding='utf-8')
          assert 'type="file"' not in html
          assert 'getElementById(\'files\')' not in html
          assert './characters/' in html
          assert 'Character Lab' not in html
          scripts=re.findall(r'<script type="module">(.*?)</script>',html,re.S)
          assert len(scripts)==1
          Path('/tmp/farmflex-player-creation.mjs').write_text(scripts[0],encoding='utf-8')
          PY
          node --check /tmp/farmflex-player-creation.mjs
      - name: Strict GDScript validation
        run: |
          set -o pipefail
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script' /tmp/import.log; then exit 1; fi
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --quit-after 15 2>&1 | tee /tmp/runtime.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|Invalid call|Invalid access|ERROR:' /tmp/runtime.log; then exit 1; fi
      - name: Verify original male and female animation sources
        run: |
          set -o pipefail
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tools/test_uploaded_mixamo.gd 2>&1 | tee /tmp/source-mixamo-tests.log
          grep -q 'ORIGINAL MIXAMO IMPORTS PASS' /tmp/source-mixamo-tests.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:' /tmp/source-mixamo-tests.log; then exit 1; fi
      - name: Export web
        run: |
          set -o pipefail
          mkdir -p build/web
          BUILD_NAME="farmflex-${GITHUB_SHA:0:8}"
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --export-release Web "build/web/${BUILD_NAME}.html" 2>&1 | tee /tmp/export.log
          cp "build/web/${BUILD_NAME}.html" build/web/index.html
          # First visit: show character creation, never the existing Character Lab.
          python3 - <<'PY'
          from pathlib import Path
          index = Path("build/web/index.html")
          html = index.read_text(encoding="utf-8")
          selector = """<script>(function(){try{var p=JSON.parse(localStorage.getItem('farmflex_character_v1')||'null');if(!p||p.locked!==true){location.replace('./create-character.html');}}catch(e){console.warn('Character selection redirect:',e);}})();</script>"""
          if "</head>" not in html:
              raise SystemExit("No </head> in Godot export")
          index.write_text(html.replace("</head>",selector+"</head>",1),encoding="utf-8")
          PY

          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|ERROR:' /tmp/export.log; then exit 1; fi
          test -s build/web/index.html
          # Character Lab is archived at web/character-preview.html but NOT deployed.
          # Keep first-run creation screen and the actual FarmFlex game available.
          cp web/create-character.html build/web/create-character.html
          mkdir -p build/web/characters
          cp assets/characters/Female_Character_Complete.glb build/web/characters/
          cp assets/characters/Male_Character_Complete.glb build/web/characters/
          cp web/character_assets/character_atlas.jpg build/web/characters/
          test -s build/web/characters/Female_Character_Complete.glb
          test -s build/web/characters/Male_Character_Complete.glb
          echo 'ONLINE CHARACTER FILES:'
          ls -lh build/web/characters/

          test -s build/web/create-character.html
          test ! -e build/web/character-preview.html
          test ! -e build/web/farmflex-characters-v2.html
          touch build/web/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - name: Allow Pages artifact metadata to synchronize
        run: sleep 15
      - uses: actions/deploy-pages@v4
      - name: Diagnose live Pages publication
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "PAGES CONFIGURATION (published URL / source):"
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{html_url, build_type, source, status}' || true
          echo "PUBLIC URL CHECKS:"
          for path in index.html create-character.html characters/Female_Character_Complete.glb characters/Male_Character_Complete.glb character-preview.html farmflex-characters-v2.html; do
            URL="https://redfullmoon209-debug.github.io/happy-farm/$path?probe=$GITHUB_SHA"
            CODE=$(curl -L -sS --connect-timeout 6 --max-time 20 -o /dev/null -w "%{http_code}" "$URL" || true)
            echo "$path => HTTP $CODE"
          done
      - name: Save backup regression tests
        run: |
          set -o pipefail
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tools/test_saves.gd 2>&1 | tee /tmp/save-tests.log
          grep -q 'SAVE TESTS PASS' /tmp/save-tests.log
      - name: Farm expansion and pig-purchase tests
        run: |
          set -o pipefail
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tools/test_farm.gd 2>&1 | tee /tmp/farm-tests.log
          grep -q 'FARM TESTS PASS' /tmp/farm-tests.log
      - name: Farm levels, plot locks and EXP progression
        run: |
          set -o pipefail
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tools/test_levels.gd 2>&1 | tee /tmp/level-tests.log
          grep -q 'LEVEL TESTS PASS' /tmp/level-tests.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|ERROR:' /tmp/level-tests.log; then exit 1; fi
      - name: Free-form plot building, tree shopping and chopping
        run: |
          set -o pipefail
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tools/test_landscaping.gd 2>&1 | tee /tmp/landscaping-tests.log
          grep -q 'LANDSCAPING TESTS PASS' /tmp/landscaping-tests.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|ERROR:' /tmp/landscaping-tests.log; then exit 1; fi
      - name: Large world, land expansion, decoration shop and GM tests
        run: |
          set -o pipefail
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tools/test_world.gd 2>&1 | tee /tmp/world-tests.log
          grep -q 'WORLD TESTS PASS' /tmp/world-tests.log
          if grep -E 'WORLD TEST FAIL:|SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|ERROR:' /tmp/world-tests.log; then exit 1; fi
      - name: Character movement and animations
        run: |
          set -o pipefail
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tools/test_farmer.gd 2>&1 | tee /tmp/farmer-test.log
          grep -q 'FARMER TESTS PASS' /tmp/farmer-test.log
      - name: Happy Farm audio integration checks
        run: |
          set -o pipefail
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tools/test_audio.gd 2>&1 | tee /tmp/audio-tests.log
          grep -q 'AUDIO TESTS PASS' /tmp/audio-tests.log
      - name: Camera and multitouch regression tests
        run: |
          set -o pipefail
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tools/test_camera.gd 2>&1 | tee /tmp/camera-tests.log
          grep -q 'CAMERA TESTS PASS' /tmp/camera-tests.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|ERROR:' /tmp/camera-tests.log; then exit 1; fi
      - name: PC WASD and transparent PNG UI layers
        run: |
          set -o pipefail
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tools/test_wasd_ui.gd 2>&1 | tee /tmp/wasd-ui-tests.log
          grep -q 'WASD UI TESTS PASS' /tmp/wasd-ui-tests.log
          if grep -E 'WASD UI FAIL:|SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|ERROR:' /tmp/wasd-ui-tests.log; then exit 1; fi
