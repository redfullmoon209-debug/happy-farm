name: Import KungFu outfit on test branch
on:
  push:
    branches: [kungfu-import-test]
    paths: [Female_KungFu.zip]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/kungfu-import-test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack exact user asset
        run: |
          unzip -p Female_KungFu.zip Female_KungFu.fbx > /tmp/Female_KungFu.fbx
          echo '4f10f198cc133e5d588d440f7702e68a6b40ff5c867cd1fce40c72d2c1f60a78  /tmp/Female_KungFu.fbx' | sha256sum -c
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender
      - name: Append outfit and transfer weights
        run: blender --background --python-exit-code 1 --python tools/import_kungfu.py -- /tmp/Female_KungFu.fbx
      - name: Add KungFu to modular wardrobe regression test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/test_modular_wardrobe.gd')
          s = p.read_text()
          assert '["black_red", "pink"]' in s
          p.write_text(s.replace('["black_red", "pink"]', '["black_red", "pink", "kungfu"]', 1))
          PY
      - name: Download Godot and validate
        run: |
          curl -fLsS --retry 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.4.1-stable_linux.x86_64
          set -o pipefail
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path . --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script' /tmp/import.log; then exit 1; fi
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tools/test_modular_wardrobe.gd 2>&1 | tee /tmp/test.log
          grep -F 'MODULAR CHECK []' /tmp/test.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:|Invalid call|Invalid access' /tmp/test.log; then exit 1; fi
      - name: Commit validated assets to isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/characters/modular/Female scripts/FemaleWardrobe.gd tools/test_modular_wardrobe.gd
          git commit -m 'Import KungFu wardrobe and validate five slots'
          git push origin HEAD:kungfu-import-test
